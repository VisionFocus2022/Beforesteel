[project]
name = "solidworks-mcp"
version = "0.3.0"
description = "Standard MCP server for designing SolidWorks parts via COM automation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SolidWorks MCP Contributors"}
]
dependencies = [
    "pywin32>=306",
    "mcp[cli]>=1.28.1,<1.29.0",
    "pydantic>=2.12.0,<3.0.0",
    "pywinauto>=0.6.8 ; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = [
    "coverage>=7.6,<8.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["solidworks_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "real_sw: requires a running, visible SolidWorks 2026 instance (skipped in CI; run with -m real_sw and SOLIDWORKS_MCP_E2E=1)",
]

[tool.coverage.run]
branch = true
source = ["solidworks_mcp"]

[tool.coverage.report]
fail_under = 80
show_missing = true
